name: Main 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: 1.22

    - name: Kernel Modules
      run: ./.github/scripts/modprobe.sh
      shell: bash

    - name: Check host
      run: ./.github/scripts/check_host.sh
      shell: bash

    - name: Test
      run: sudo -E env PATH=$PATH go test -v ./ ./nl -run="TestXfrmStateWithPcpunumWithoutSADir"

